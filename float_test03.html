<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float 연습</title>
    <style>
        div {
            border: 1px solid gainsboro;
            border-radius: 5px;
            width: 800px;
            height: 300px;
        }
        img {
            float: left;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <div>
        <h2>아름다운 장미</h2>
    
        <img src="img/rose.jpg" width="200" alt="장미">

        <p>
            장미는 사람들이 가장 좋아하는 꽃입니다.
            장미는 5월의 여왕처럼 아름다운 꽃입니다.
            장미는 빨간색 장미와 검은색 흑장미가 유명합니다.
        </p>
    </div>
</body>
</html>
